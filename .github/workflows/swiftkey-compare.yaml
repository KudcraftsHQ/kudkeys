# Research only: SwiftKey vs Kud Keys typed side by side on an emulator (android/tools/swiftkey-compare/).
# Runs only on pushes to tools/swiftkey-compare. Never merged.
name: swiftkey-compare

on:
  push:
    branches: ['tools/swiftkey-compare']

concurrency:
  group: swiftkey-compare
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android NDK
        working-directory: android
        run: |
          NDK=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null

      - name: Build Kud Keys debug + TypeTest
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:assembleDebug :tools:typetest:assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/apks"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/apks/kudkeys-debug.apk"
          cp tools/typetest/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/apks/typetest.apk"

      - name: Synthetic SwiftKey-style add-on dictionary (common words only)
        working-directory: android
        env:
          SYNTH_DICT_OUT: ${{ github.workspace }}/apks/synthetic/swiftkey_user.dict
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'helium314.keyboard.kudkeys.KudCompareSyntheticDictTest'
          ls -la "$SYNTH_DICT_OUT"

      - name: Download SwiftKey (never committed)
        run: |
          set -x
          curl -sSL -o apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x apkeep
          mkdir -p dl
          # research-only mirror (apkeep's USAGE-apkpure.md); the signer is printed below to check it is TouchType's
          ./apkeep -a com.touchtype.swiftkey -d apk-pure -o 'acknowledge_dangers=true,arch=x86_64' dl || true
          ls -la dl
          mkdir -p apks/swiftkey
          f=$(ls dl/* | head -1)
          case "$f" in
            *.xapk|*.apks|*.zip) unzip -o -q "$f" -d dl/x; find dl/x -name '*.apk' -exec cp {} apks/swiftkey/ \; ;;
            *.apk) cp "$f" apks/swiftkey/base.apk ;;
          esac
          ls -la apks/swiftkey
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | tail -1); for a in apks/swiftkey/*.apk; do "${BT}apksigner" verify --print-certs "$a" | head -2; done
          cat dl/x/manifest.json 2>/dev/null | head -c 2000 || true

      - name: Python deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr ffmpeg > /dev/null
          pip install -q pillow uiautomator2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compare on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OUT: ${{ github.workspace }}/compare-out
          APKS: ${{ github.workspace }}/apks
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 android/tools/swiftkey-compare/run.py all

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-out
          path: compare-out/
          if-no-files-found: warn
