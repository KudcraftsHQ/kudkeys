# Research only: before (main) vs after (this branch) traces of the keyboard opening on an emulator
# (android/tools/perf-first-open/). Lives on perf/instant-first-open-ci only; never merged.
name: perf-first-open

on:
  workflow_dispatch:
  push:
    branches: ['perf/**']

concurrency:
  group: perf-first-open-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android NDK
        working-directory: android
        run: |
          NDK=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null

      - name: TypeTest (from tools/swiftkey-compare)
        run: |
          git checkout origin/tools/swiftkey-compare -- android/tools/typetest
          echo "include ':tools:typetest'" >> android/settings.gradle

      - name: Build after (this branch) + TypeTest
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:assembleDebug :tools:typetest:assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/apks"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/apks/after.apk"
          cp tools/typetest/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/apks/typetest.apk"

      - name: Build before (main)
        run: |
          git worktree add "$RUNNER_TEMP/before" origin/main
          cd "$RUNNER_TEMP/before/android"
          ./gradlew --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/apks/before.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Measure on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OUT: ${{ github.workspace }}/perf-out
          APKS: ${{ github.workspace }}/apks
          N: '6'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 android/tools/perf-first-open/run.py before after

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-out
          path: perf-out/
          if-no-files-found: warn
